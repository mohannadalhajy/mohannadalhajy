<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="512" viewBox="0 0 1200 512" role="img" aria-label="Vidnik architecture: mobile, web, CRM and webhook clients call a NestJS API gateway fronting a modular monolith, backed by MongoDB, Redis, S3, AWS Rekognition, OpenAI, and Apple/Google billing.">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#565f69"/></marker>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.h1{font-size:24px;font-weight:700}
.sub{font-size:14px}
.bt{font-size:14px;font-weight:600;text-anchor:middle}
.bs{font-size:11.5px;text-anchor:middle}
.bl{font-size:11.5px;text-anchor:start}
.lbl{font-size:10.5px;font-weight:700;letter-spacing:.08em}
</style>
</defs>
<rect width="1200" height="512" rx="14" fill="#0d1117"/><text x="40" y="52" class="h1" fill="#f0f6fc">Vidnik — one modular NestJS backend, four surfaces</text><text x="40" y="78" class="sub" fill="#9198a1">30,000+ registered users · ~90 CRM screens · ~87 permission keys across 4 staff roles</text><rect x="40" y="108" width="264" height="64" rx="10" fill="#151b23" stroke="#3d444d"/><text x="172.0" y="136.0" class="bt" fill="#f0f6fc">iOS / Android</text><text x="172.0" y="154.0" class="bs" fill="#9198a1">Apple + Google billing</text><path d="M172 172 V 206" stroke="#565f69" stroke-width="1.5" marker-end="url(#a)"/><rect x="318" y="108" width="264" height="64" rx="10" fill="#151b23" stroke="#3d444d"/><text x="450.0" y="136.0" class="bt" fill="#f0f6fc">Web App</text><text x="450.0" y="154.0" class="bs" fill="#9198a1">Next.js</text><path d="M450 172 V 206" stroke="#565f69" stroke-width="1.5" marker-end="url(#a)"/><rect x="596" y="108" width="264" height="64" rx="10" fill="#151b23" stroke="#3d444d"/><text x="728.0" y="136.0" class="bt" fill="#f0f6fc">Vidnik CRM</text><text x="728.0" y="154.0" class="bs" fill="#9198a1">~90 screens · RBAC</text><path d="M728 172 V 206" stroke="#565f69" stroke-width="1.5" marker-end="url(#a)"/><rect x="874" y="108" width="264" height="64" rx="10" fill="#151b23" stroke="#3d444d"/><text x="1006.0" y="136.0" class="bt" fill="#f0f6fc">Webhooks</text><text x="1006.0" y="154.0" class="bs" fill="#9198a1">stores · payments</text><path d="M1006 172 V 206" stroke="#565f69" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="206" width="1120" height="52" rx="10" fill="#121d2f" stroke="#1f6feb"/><text x="600.0" y="237.0" class="bt" fill="#4493f8">API Gateway — JWT auth · rate limiting · request validation · permission guard</text><path d="M600 258 V 292" stroke="#565f69" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="292" width="1120" height="94" rx="10" fill="#151b23" stroke="#3d444d"/><text x="58" y="314" class="lbl" fill="#9198a1">MODULAR MONOLITH · hard internal boundaries</text><rect x="58" y="326" width="174" height="44" rx="8" fill="#0d1117" stroke="#1f6feb"/><text x="145.0" y="353.0" class="bt" fill="#f0f6fc">Identity &amp; KYC</text><rect x="240" y="326" width="174" height="44" rx="8" fill="#0d1117" stroke="#1f6feb"/><text x="327.0" y="353.0" class="bt" fill="#f0f6fc">Matching</text><rect x="422" y="326" width="174" height="44" rx="8" fill="#0d1117" stroke="#1f6feb"/><text x="509.0" y="353.0" class="bt" fill="#f0f6fc">Realtime Chat</text><rect x="604" y="326" width="174" height="44" rx="8" fill="#0d1117" stroke="#1f6feb"/><text x="691.0" y="353.0" class="bt" fill="#f0f6fc">Moderation</text><rect x="786" y="326" width="174" height="44" rx="8" fill="#0d1117" stroke="#1f6feb"/><text x="873.0" y="353.0" class="bt" fill="#f0f6fc">Billing</text><rect x="968" y="326" width="174" height="44" rx="8" fill="#0d1117" stroke="#1f6feb"/><text x="1055.0" y="353.0" class="bt" fill="#f0f6fc">Support Desk</text><path d="M220 386 V 408" stroke="#565f69" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="408" width="360" height="82" rx="10" fill="#0f2916" stroke="#2ea043"/><text x="56" y="428" class="lbl" text-anchor="start" fill="#3fb950">DATA</text><text x="56" y="447" class="bl" fill="#9198a1">MongoDB</text><text x="56" y="463" class="bl" fill="#9198a1">Redis + Redlock</text><text x="56" y="479" class="bl" fill="#9198a1">AWS S3</text><path d="M600 386 V 408" stroke="#565f69" stroke-width="1.5" marker-end="url(#a)"/><rect x="420" y="408" width="360" height="82" rx="10" fill="#26150b" stroke="#9e4b12"/><text x="436" y="428" class="lbl" text-anchor="start" fill="#f0883e">AI / VISION</text><text x="436" y="447" class="bl" fill="#9198a1">AWS Rekognition (liveness)</text><text x="436" y="463" class="bl" fill="#9198a1">OpenAI vision moderation</text><text x="436" y="479" class="bl" fill="#9198a1">AWS Comprehend</text><path d="M980 386 V 408" stroke="#565f69" stroke-width="1.5" marker-end="url(#a)"/><rect x="800" y="408" width="360" height="82" rx="10" fill="#121d2f" stroke="#1f6feb"/><text x="816" y="428" class="lbl" text-anchor="start" fill="#4493f8">MONEY &amp; DELIVERY</text><text x="816" y="447" class="bl" fill="#9198a1">Apple IAP (idempotent)</text><text x="816" y="463" class="bl" fill="#9198a1">Google Play Billing</text><text x="816" y="479" class="bl" fill="#9198a1">Socket.IO + FCM</text>
</svg>